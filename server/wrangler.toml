name = "salef-al-awaleen"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
ALLOWED_ORIGINS = "https://3wasfnjd.github.io,http://localhost:5173,http://localhost:4173"
GEMINI_LIVE_MODEL = "gemini-3.1-flash-live-preview"
# Default prebuilt Gemini voice, and the male voices the app may switch between.
GEMINI_VOICE = "Algenib"
VOICE_CHOICES = "Algenib,Charon,Sadaltager,Enceladus,Orus,Iapetus,Schedar,Umbriel"

# Secrets (set by the deploy workflow from GitHub secrets, never committed):
#   GEMINI_API_KEY, ACCESS_CODES
