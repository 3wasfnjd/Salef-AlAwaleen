name: Build Quest APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Android SDK and Godot
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip wget openjdk-17-jdk
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v4.3-stable_linux.x86_64"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          echo "$HOME/godot" >> "$GITHUB_PATH"
      - name: Configure export
        run: |
          echo 'ANDROID_HOME='"${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo 'ANDROID_SDK_ROOT='"${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          keytool -genkeypair -v -keystore /tmp/salef-debug.keystore -alias salef -keyalg RSA -keysize 2048 -validity 1000 -storepass android -keypass android -dname "CN=Salef Test"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/salef-debug.keystore' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=salef' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
      - name: Import and export APK
        run: |
          mkdir -p build
          Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit
          Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug "Android" build/salef-quest-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: salef-quest-debug
          path: build/salef-quest-debug.apk
          if-no-files-found: error
