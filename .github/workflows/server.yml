name: Deploy voice server (Cloudflare Worker)

# Free Cloudflare Workers plan. Needs these repository secrets (Settings →
# Secrets and variables → Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# GEMINI_API_KEY, ACCESS_CODES. Without them the job explains what is missing
# and exits without failing the build.
on:
  push:
    branches: [main]
    paths: ['server/**', 'persona/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      WRANGLER_VERSION: 4.146.0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ACCESS_CODES: ${{ secrets.ACCESS_CODES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required secrets
        id: check
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GEMINI_API_KEY ACCESS_CODES; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Voice server not deployed. Missing repository secrets:$missing (see docs/PHASE2_SETUP_AR.md)"
            echo "### Voice server not deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing repository secrets:$missing — see docs/PHASE2_SETUP_AR.md" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Worker
        if: steps.check.outputs.ready == 'true'
        working-directory: server
        run: |
          set -euo pipefail
          npx -y "wrangler@${WRANGLER_VERSION}" deploy 2>&1 | tee deploy.log
          printf '%s' "$GEMINI_API_KEY" | npx -y "wrangler@${WRANGLER_VERSION}" secret put GEMINI_API_KEY
          printf '%s' "$ACCESS_CODES" | npx -y "wrangler@${WRANGLER_VERSION}" secret put ACCESS_CODES

      - name: Health check
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          URL="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' server/deploy.log | head -1)"
          test -n "$URL"
          for i in $(seq 1 10); do curl -sf "$URL/health" && break; sleep 3; done
          echo
          curl -sf "$URL/health" | grep -q '"configured":true'
          {
            echo "### Voice server"
            echo "- URL: $URL"
            echo "- Health: \`$(curl -sf "$URL/health")\`"
          } >> "$GITHUB_STEP_SUMMARY"
