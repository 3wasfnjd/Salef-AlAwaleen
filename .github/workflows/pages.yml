name: Deploy web preview (GitHub Pages)

# Free HTTPS hosting for the iPhone / Quest Browser preview at
# https://3wasfnjd.github.io/Salef-AlAwaleen/
# Publishes the built site to the `gh-pages` branch (Pages source: gh-pages / root),
# which needs no extra repository settings.
on:
  push:
    branches: [main]
  # Rebuild after the voice server deploys so the site picks up its URL.
  workflow_run:
    workflows: ['Deploy voice server (Cloudflare Worker)']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Locate the voice server URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_BASE_OVERRIDE: ${{ vars.API_BASE }}
        run: |
          API_BASE="$API_BASE_OVERRIDE"
          if [ -z "$API_BASE" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            SUB="$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).result.subdomain||"")}catch{}})' || true)"
            [ -n "$SUB" ] && API_BASE="https://salef-al-awaleen.$SUB.workers.dev"
          fi
          echo "VITE_API_BASE=$API_BASE" >> "$GITHUB_ENV"
          echo "Voice server: ${API_BASE:-not configured}"
      - run: npm run build
      - name: Publish dist/ to gh-pages
        run: |
          set -euo pipefail
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "### Web preview" >> "$GITHUB_STEP_SUMMARY"
          echo "https://3wasfnjd.github.io/Salef-AlAwaleen/" >> "$GITHUB_STEP_SUMMARY"
